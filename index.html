<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>OAutoScroll</title>

    <link rel="stylesheet" type="text/css" href="style/style.css">

    <script type="text/javascript" src="./../v1/plugins.js"></script>
    <script type="module" src="scripts/plugin.js"></script>
</head>

<body>
    <div id="app">

        <!-- Информер (Кликабелен только при наличии позиции) -->
        <div id="viewCard" class="info-card disabled" role="button" tabindex="0">
            <div class="info-card-content">
                <!-- SVG: Target Icon -->
                <svg class="icon info-icon" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 2a8 8 0 0 1 8 8a8 8 0 0 1-8 8a8 8 0 0 1-8-8a8 8 0 0 1 8-8m0 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z" />
                </svg>
                <div id="viewCardText" class="info-text">
                    Документ открыт впервые, сохраненная позиция не найдена
                </div>
            </div>
            <!-- SVG: Shortcut / Arrow Icon -->
            <svg class="icon action-icon" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83l1.41 1.41L19 6.41V10h2V3h-7z" />
            </svg>
        </div>

        <!-- Кнопки действий -->
        <div class="actions-group">
            <button id="clearScrollBtn" class="btn btn-ghost-warning">
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M16.24 3.56L21.19 8.5c.78.78.78 2.05 0 2.83l-8.2 8.2h8.01v2H9.41c-.53 0-1.04-.21-1.41-.59l-4.95-4.95c-.78-.78-.78-2.05 0-2.83l9.19-9.19c.78-.78 2.05-.78 2.83 0M6.46 14.88l3.54 3.54l3.53-3.53l-3.53-3.54l-3.54 3.53Z" />
                </svg>
                Стереть текущую позицию
            </button>

            <button id="saveScrollBtn" class="btn btn-primary">
                <!-- SVG: Save Icon -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3s3 1.34 3 3s-1.34 3-3 3zm3-10H5V5h10v4z" />
                </svg>
                Сохранить текущую позицию
            </button>
        </div>

        <!-- Настройки плагина -->
        <div class="settings-section">
            <h3 class="section-title">НАСТРОЙКИ ПЛАГИНА</h3>
            <label class="checkbox-label">
                <input type="checkbox" id="moveOnOpenCheckbox">
                <span>Перемещаться при открытии</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="saveOnCloseCheckbox">
                <span>Сохранять позицию при закрытии</span>
            </label>
        </div>

        <!-- Статистика и Удаление -->
        <div class="footer-section">
            <div class="stat-item">
                <span class="stat-label">Ключей <code>oautoscroll_plugin_</code>:</span>
                <span id="keysCount" class="stat-value">0</span>
            </div>

            <button id="clearAllBtn" class="btn btn-danger-outline">
                <!-- SVG: Trash Icon -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                </svg>
                Удалить все записи
            </button>
        </div>
    </div>
</body>

</html>
